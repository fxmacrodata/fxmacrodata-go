    FreemiumDelayNotice:
      description: |-
        How far behind real time a free-tier response is, and what that costs.

        Present only for callers without a paid key, and present whether or not
        anything was actually withheld: a delayed response must never be mistakable
        for a current one. ``withheld_count`` is how many releases were held back
        from *this* response; ``next_available_at`` is when the oldest of them
        becomes readable.

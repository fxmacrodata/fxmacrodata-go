  /v1/risk_sentiment:
    get:
      description: |-
        Returns a composite daily risk-sentiment score indicating whether global financial conditions favour risk-on currencies (AUD, NZD, CAD) or risk-off safe havens (JPY, CHF, USD).

        The score is derived from four publicly available sources:
        - **OFR FSI** (U.S. Treasury Office of Financial Research Financial Stress Index) — primary stress gauge, *inverted*
        - **Gold** (The Royal Mint spot reference chart observations) — safe-haven demand proxy, *inverted*
        - **AUD/USD** (Frankfurter API) — risk-sensitive currency pair
        - **USD/JPY** (Frankfurter API) — safe-haven flow proxy

        Each component is normalised to a 252-day rolling z-score, weighted, and compressed through tanh to produce a final score in **[-1.0, +1.0]**.

        **Weights:** OFR FSI 40%, Gold 20%, AUD/USD 20%, USD/JPY 20%.

        **Query Parameters:**
        - `start_date`: Start date YYYY-MM-DD (default: 365 days ago).
        - `end_date`: End date YYYY-MM-DD (default: today).

        **Each data record contains:**
        - `date`: Observation date (YYYY-MM-DD).
        - `val`: Composite score -1.0 (extreme risk-off) ... +1.0 (extreme risk-on).
        - `regime`: `risk_on` (>= 0.25) | `neutral` | `risk_off` (<= -0.25).
        - `components.ofr_fsi`: Normalised (inverted) OFR FSI contribution.
        - `components.gold`: Normalised (inverted) gold price contribution.
        - `components.aud_usd`: Normalised AUD/USD contribution.
        - `components.usd_jpy`: Normalised USD/JPY contribution.
      operationId: get_risk_sentiment
      parameters:
      - description: Optional query parameter. Start date YYYY-MM-DD
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Start date YYYY-MM-DD
          title: Start Date
          type: string
        style: form
      - description: Optional query parameter. End date YYYY-MM-DD
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: End date YYYY-MM-DD
          title: End Date
          type: string
        style: form
      - description: Optional query parameter. Maximum rows to return. Defaults to
          20. Maximum 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: Maximum rows to return. Defaults to 20. Maximum 100.
          format: int64
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: Optional query parameter. Number of rows to skip after most-recent-first
          ordering.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of rows to skip after most-recent-first ordering.
          format: int64
          minimum: 0
          title: Offset
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                start_date: 2025-12-01
                end_date: 2026-03-01
                data:
                - date: 2026-02-28
                  val: 0.31
                  regime: risk_on
                  components:
                    ofr_fsi: 0.18
                    gold: -0.07
                    aud_usd: 0.09
                    usd_jpy: 0.04
              schema:
                $ref: "#/components/schemas/RiskSentimentResponse"
          description: Risk sentiment time series and component-level contributions.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Global risk-on / risk-off indicator
      tags:
      - FXMacroData

      parameters:
      - description: "Required path parameter. Allowed values: AUD, BRL, CAD, CHF,\
          \ CNH, CNY, COMM, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR, NGN, NOK, NZD,\

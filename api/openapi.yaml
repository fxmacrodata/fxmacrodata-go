      summary: Per-indicator forecast coverage for one currency (no API key)
      tags:
      - FXMacroData
  /v1/predictions/{currency}/{indicator}:
    get:
      description: |-
        Returns every available prediction for the requested ``currency``/``indicator`` pair. Each row is stamped with its original ``generated_at`` and full source provenance (real archived vintage vs FXMacroData's own live-generated forecast, never reconstructed with later data). Per-source archive start dates and market-consensus coverage vary by indicator: see https://fxmacrodata.com/documentation/point-in-time-backtesting for the exact earliest date per source and indicator before assuming multi-year depth exists for every series.

        **Authentication:** this endpoint requires an API key on every currency, including USD. Anonymous callers receive 401 `api_key_required`. A 14-day free trial at https://fxmacrodata.com/subscribe opens the full history on all 18 currencies.
      operationId: get_predictions
      parameters:
      - description: "Required path parameter. Allowed values: AUD, BRL, CAD, CHF,\
          \ CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR, NGN, NOK, NZD, PEN,\
          \ SEK, THB, TWD, USD."
        explode: false
        in: path
        name: currency
        required: true
        schema:
          example: AUD
          title: Currency
          type: string
        style: simple
      - description: "Required path parameter. Indicator slug Allowed values: afe_dollar_index,\
          \ average_hourly_earnings, average_hourly_earnings_mom, balance_on_goods,\
          \ balance_on_services, bgcr, breakeven_inflation_rate, broad_dollar_index,\
          \ broad_money, building_approvals, building_permits, business_confidence,\
          \ capital_account_balance, cb_assets, commodity_price_energy, commodity_price_ex_energy,\
          \ commodity_price_index, commodity_prices, consumer_confidence, core_inflation,\
          \ core_inflation_median, core_inflation_mom, core_inflation_trim, core_pce,\
          \ core_pce_mom, credit_growth, crude_oil_inventories, current_account_balance,\
          \ dairy_exports, deposit_rates, durable_goods_orders, effr, eme_dollar_index,\
          \ employment, exports, financial_account_balance, foreign_reserves, full_time_employment,\
          \ fx_reserves, gdp, gdp_growth_q4_yoy, gold_reserves, gov_bond_10y, gov_bond_15y,\
          \ gov_bond_1_5m, gov_bond_1m, gov_bond_1y, gov_bond_20y, gov_bond_25y, gov_bond_2m,\
          \ gov_bond_2y, gov_bond_30y, gov_bond_3m, gov_bond_3y, gov_bond_40y, gov_bond_4m,\
          \ gov_bond_4y, gov_bond_5y, gov_bond_6m, gov_bond_6y, gov_bond_7y, gov_bond_8y,\
          \ gov_bond_9y, government_debt, house_price_index, house_prices, household_credit,\
          \ household_spending, housing_starts, imports, inflation, inflation_linked_bond,\
          \ inflation_mom, initial_jobless_claims, international_assets, international_liabilities,\
          \ job_openings, m1, m2, m3, nairu, natural_gas_storage, net_foreign_asset_position,\
          \ non_farm_payrolls, non_farm_payrolls_change, obfr, part_time_employment,\
          \ participation_rate, pce, pce_mom, policy_rate, policy_rate_midpoint, policy_rate_mlf,\
          \ policy_rate_mro, policy_rate_target_lower, ppi, primary_income_balance,\
          \ real_yield_20y, real_yield_30y, real_yield_5y, real_yield_7y, retail_sales,\
          \ retail_sales_control_group, retail_sales_ex_autos, retail_sales_ex_autos_and_gas,\
          \ risk_free_rate, secondary_income_balance, sight_deposits, snb_balance_sheet,\
          \ sofr_average_180d, sofr_average_30d, sofr_average_90d, sofr_index, terms_of_trade,\
          \ tgcr, trade_balance, trade_weighted_index, trimmed_mean_inflation, unemployment,\
          \ wage_price_index, wages."
        explode: false
        in: path
        name: indicator
        required: true
        schema:
          description: Indicator slug
          example: afe_dollar_index
          title: Indicator
          type: string
        style: simple
      - description: "Optional query parameter. Filter by how the forecast was produced.\
          \ Prefer this over `prediction_type`: one class can span several legacy\
          \ types, which is how `forecaster_survey` returns both the ECB and Philadelphia\
          \ Fed Surveys of Professional Forecasters."
        explode: true
        in: query
        name: prediction_class
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional legacy prediction-type filter,\
          \ retained unchanged for existing clients. Superseded by `prediction_class`."
        explode: true
        in: query
        name: prediction_type
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. Optional source identifier filter.
        explode: true
        in: query
        name: prediction_source
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. Maximum rows in ``official_forecasts``
          (native-period official forecasts and surveys). 0 omits them.
        explode: true
        in: query
        name: official_limit
        required: false
        schema:
          default: 500
          description: Maximum rows in ``official_forecasts`` (native-period official
            forecasts and surveys). 0 omits them.
          format: int64
          maximum: 2000
          minimum: 0
          title: Official Limit
          type: integer
        style: form
      - description: "Optional query parameter. Return only forecasts with `generated_at`\
          \ strictly before the linked `announcement_datetime` (default: true). FXMacroData\
          \ only publishes forecasts generated before the announcement, so this flag\
          \ is informational: setting it to false does not return additional rows."
        explode: true
        in: query
        name: pre_release_only
        required: false
        schema:
          default: true
          description: "Return only forecasts with `generated_at` strictly before\
            \ the linked `announcement_datetime` (default: true). FXMacroData only\
            \ publishes forecasts generated before the announcement, so this flag\
            \ is informational: setting it to false does not return additional rows."
          title: Pre Release Only
          type: boolean
        style: form
      - description: "Optional query parameter. Optional seasonal adjustment selector,\
          \ matching /v1/announcements. Allowed values: sa, nsa."
        explode: true
        in: query
        name: seasonality
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional returned change basis selector,\
          \ matching /v1/announcements. Allowed values: level, yoy, qoq, mom."
        explode: true
        in: query
        name: frequency
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional annualization selector, matching\
          \ /v1/announcements. Allowed values: not_annualized, saar."
        explode: true
        in: query
        name: annualization
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional period aggregation selector,\
          \ matching /v1/announcements. Allowed values: monthly, quarterly_average."
        explode: true
        in: query
        name: period_aggregation
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional real/nominal selector, matching\
          \ /v1/announcements. Allowed values: real, nominal."
        explode: true
        in: query
        name: basis
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. Start date YYYY-MM-DD (period date).
          Defaults to 180 days before today when omitted.
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. End date YYYY-MM-DD (period date).
          Defaults to 90 days ahead when omitted.
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Maximum number of prediction groups\
          \ to return in `data[]`. Use with `offset` to page through long histories.\
          \ Defaults to 20. Maximum 100."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: "Maximum number of prediction groups to return in `data[]`.\
            \ Use with `offset` to page through long histories. Defaults to 20. Maximum\
            \ 100."
          format: int64
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: "Optional query parameter. Number of prediction groups to skip\
          \ from the start of `data[]`. Use with `limit` for pagination. Defaults\
          \ to 0."
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: "Number of prediction groups to skip from the start of `data[]`.\
            \ Use with `limit` for pagination. Defaults to 0."
          format: int64
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: "Optional query parameter. One-based page number. When supplied,\
          \ it takes precedence over offset."
        explode: true
        in: query
        name: page
        required: false
        schema:
          description: One-based page number.
          format: int64
          minimum: 1
          nullable: true
          type: integer
        style: form
      - description: Optional query parameter. Return groups strictly before this
          YYYY-MM-DD period date. Use the previous response's `next_cursor` for bounded
          pagination.
        explode: true
        in: query
        name: before_date
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter.
        explode: true
        in: query
        name: as_of
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Optional query parameter.
        explode: true
        in: query
        name: event_compatible_only
        required: false
        schema:
          default: false
          title: Event Compatible Only
          type: boolean
        style: form

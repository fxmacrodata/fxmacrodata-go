            \ One of ``compiled_consensus`` (a publisher's compilation of independent\
            \ forecasters), ``forecaster_survey`` (an official survey of forecasters\
            \ or market participants), ``market_implied`` (derived from traded prices),\
            \ ``model_nowcast`` (a published statistical model), ``central_bank_projection``\
            \ (the central bank's own projection), ``institutional_projection`` (IMF,\
            \ OECD), or ``fxmacrodata`` (an FXMacroData estimate, never a market consensus)."
          nullable: true
          type: string
        prediction_class_label:
          description: "Human-readable name for ``prediction_class``, for display.\
            \ Filter on ``prediction_class``, not on this."
          nullable: true
          type: string
        prediction_type:
          description: "Original per-source category, retained unchanged for backward\
            \ compatibility: ``market_consensus``, ``market_prediction``, ``model_nowcast``,\
            \ ``survey``, ``central_bank_forecast``, ``central_bank_projection``,\
            \ ``imf_weo``, ``oecd_eo`` or ``fxmacrodata``. These slugs split identical\
            \ instruments (the ECB and Philadelphia Fed Surveys of Professional Forecasters\
            \ landed in different values) and two of them name a publisher rather\
            \ than a category. Prefer ``prediction_class``."
          nullable: true
          type: string
        prediction_source:
          description: "Stable source identifier slug (e.g. ``philly_fed_spf``, ``cleveland_fed_nowcast``,\
            \ ``fomc_sep``, ``atlanta_fed_gdpnow``, ``ny_fed_sme``, ``ecb_spf``, ``imf_weo``,\
            \ ``rbnz_mps``, ``fxmacrodata_blended``). Use this value when filtering\
            \ via the ``prediction_source`` query parameter."
          nullable: true
          type: string
        prediction_source_label:
          description: "Human-readable name for ``prediction_source`` (e.g. \"RBA\
            \ Statement on Monetary Policy (Table J1)\", \"Philadelphia Fed Survey\
            \ of Professional Forecasters\", \"IMF World Economic Outlook\"). Suitable\
            \ for display in UI surfaces; use ``prediction_source`` for filtering\
            \ and joins."
          nullable: true
          type: string
        generated_at:
          description: "Unix epoch seconds (UTC) for the prediction's known-at marker.\
            \ Inspect `provenance.generated_at_basis` and `provenance.generated_at_precision`:\
            \ publisher archives may provide a date that FXMacroData normalizes to\
            \ a documented source-local publication time rather than an original intraday\
            \ timestamp."
          format: int64
          nullable: true
          type: integer
        provenance:
          allOf:
          - $ref: "#/components/schemas/PredictionProvenance"
          description: "Documented origin, capture, timestamp, reconstruction, and\
            \ vintage semantics for this source. Omitted for sources whose provenance\
            \ is not yet documented."
          nullable: true
        is_pre_release:
          description: Whether `generated_at` is strictly earlier than the linked
            `announcement_datetime`. Null when the source did not provide a generation
            timestamp.
          nullable: true
          type: boolean
        confidence:
          description: "Confidence score in ``[0.0, 1.0]`` indicating how strong this\
            \ prediction is. ``1.0`` is maximally confident, ``0.0`` is no confidence.\
            \ When the source did not record an explicit value, a per-source default\
            \ is returned (central-bank publications and official surveys score higher\
            \ than the FXMacroData blended forecast). Use this to weight or filter\
            \ predictions in client applications."
          format: double
          maximum: 1.0
          minimum: 0.0
          nullable: true
          type: number
        prediction_reason:
          description: "Short human-readable explanation of how this prediction was\
            \ derived. Currently populated for FXMacroData-generated predictions (``prediction_source=fxmacrodata_blended``);\
            \ it summarises the persistence anchor, momentum/trend extrapolation,\
            \ cross-indicator pressure, and any external forecast that was blended\
            \ in. Other prediction sources may omit this field."
          nullable: true
          type: string

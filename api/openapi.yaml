  /v1/calendar/{currency}:
    get:
      description: |-
        Returns upcoming economic data release dates for a given currency.

        Announcement rows keep the `release` slug mapping to `/v1/announcements/{currency}/{indicator}`, while other domains such as COT may also include additive fields like `domain`, `endpoint_family`, and `endpoint_path`. Each row also includes a deterministic `calendar_event_id` for joins across calendar exports.

        **Path Parameters:**
        - `currency`: The 3-letter currency code (e.g., USD).

        **Query Parameters:**
        - `indicator`: Optional. Filter to a specific indicator (e.g., gdp, inflation, unemployment, non_farm_payrolls).

        - `start_date`: Optional inclusive lower bound, YYYY-MM-DD.
        - `end_date`: Optional inclusive upper bound, YYYY-MM-DD.

        Past releases are retained for a bounded window. When `start_date` is given, `history_start_date` reports the oldest retained release and `history_truncated` is true if the requested window starts before it. Released values and their announcement times for older periods are available from `/v1/announcements/{currency}/{indicator}`.

        **Returns:** List of release rows sorted by announcement time ascending (nearest scheduled release first). Core fields remain `announcement_datetime` and `release`; additive routing metadata may also be present.

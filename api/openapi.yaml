  /v1/announcements/{currency}/{indicator}:
    get:
      description: |-
        Fetches historical data for a given macroeconomic indicator of a currency.

        **Authentication & limits:**
        - USD data is publicly accessible without an API key, but anonymous callers are limited to the most recent 90 days. Requests for an earlier `start_date` are clamped to that 90-day window, and the response then carries a `freemium_window` object naming the cutoff so a shortened history is distinguishable from a short series.
        - Anonymous USD data is also delayed by 15 minutes. A release is served once it is 15 minutes old; until then it is withheld, and `latest_available_date` reports the newest observation the caller can actually read. Every anonymous response carries a `freemium_delay` object naming the cutoff, the number of withheld releases and when the next one becomes available. An API key removes the delay.
        - All other currencies require an Individual or Business API key supplied via `?api_key=<key>` or the `X-API-Key` header.
        - Authenticated callers (any valid API key) receive the full requested history for every supported currency, including USD.

        **Path Parameters:**
        - `currency`: The 3-letter currency code (USD, AUD, EUR, GBP, CHF).
        - `indicator`: The indicator name (e.g., inflation, unemployment).

        **Query Parameters:**
        - `start_date`: Optional. Start date in YYYY-MM-DD format. When omitted by authenticated callers, the endpoint pages through the full available history. Anonymous USD requests are capped to the freemium window.
        - `end_date`: Optional. End date in YYYY-MM-DD format. Defaults to today.

        - `limit`: Optional page size. Defaults to 20.
        - `page`: Optional one-based page number. When provided, it takes precedence over `offset`.
        - `offset`: Optional zero-based row offset for offset-based pagination.

        - `series_mode`: Optional. `raw` (default) selects the direct underlying indicator series; `canonical` applies configured remaps.
        - `value_mode`: `normalized` (default) returns presentation-ready values. `source` requires `series_mode=raw` and returns values and revision values as published by the source, without normalization, derived changes, companion fills or carry-forward. Use source mode for historical research. The response declares `value_mode` and `value_metadata.source_unit`; an unknown source unit is null.

        **Empty windows:**
        - A valid series with no observations inside the requested window returns `200` with `data: []`, `requested_window_has_data: false`, and a `no_data` object carrying `error_code`, `latest_available_date`, `recommended_start_date` and `available_observation_count`. This is a successful query, not an error, and should not be retried; widen the window instead.
        - Anonymous USD callers see this whenever a quarterly or annual series' latest observation predates the 90-day freemium window; `no_data.freemium_clamped` marks that case.
        - `404` on this endpoint means the currency or indicator slug is not published. Use `/v1/data_catalogue/{currency}` to list valid slugs.

        **Response fields:**
        - `remap`: Metadata about the canonical remap rule application (`applied`, `rule_id`, segments, and transform mode).
        - `has_official_forecast`: Whether the relevant central bank or statistics agency publishes a preliminary, flash, or advance estimate of this indicator before the main/final data release.
        - `earliest_available_date` / `latest_available_date`: The full coverage span available in the response window before any pagination is applied.
        - `pagination`: Page metadata for the returned `data[]` slice (`limit`, `offset`, `returned_count`, `total_count`, `has_more`, `next_offset`).
        - `data[].announcement_id`: Stable identifier for this unique announcement, in the form `{currency}_{indicator}_{date}` (lowercase, e.g. `usd_inflation_2026-01-31`). Use this to join predictions from `/v1/predictions/{currency}/{indicator}` and revision history back to the underlying observation.
        - `data[].announcement_datetime`: Release timestamp as Unix epoch seconds (UTC).
        - `data[].announcement_datetime_local`: ISO 8601 release time with offset, rendered in the source agency's local timezone (e.g. USD → America/New_York, AUD → Australia/Sydney).
        - `data[].official_planned_release_datetime`: Official planned release timestamp from the publisher's release calendar, as Unix epoch seconds (UTC). Present when the release was captured against a pre-announced official release time.
        - `data[].official_actual_release_datetime`: Official release timestamp on the source row, as Unix epoch seconds (UTC). This is normally the same as `announcement_datetime` unless the source exposes a separate publication timestamp.
        - `data[].collected_at_ns` / `data[].collected_at_iso`: Exact time FXMacroData first captured this row from the official source.
        - `data[].release_timing`: On rows captured at release time, the three times for that release: `scheduled_at` (official schedule), the government publication window `published_after` / `published_by` bounded by reads of the official source (null when it could not be bounded; not a publisher-supplied timestamp), and `collected_at` (when FXMacroData captured the value). Rows that record it also carry `available_at` (when the value was readable through the API) with `pickup_ms_min` / `pickup_ms_max`, the milliseconds from the publication window to `available_at`; these are null when not recorded.
        - `data[].ingestion_latency_ms`: Milliseconds from the official planned release timestamp to collection time when a planned timestamp is known; otherwise from the official actual release timestamp.
        - `source_series_name`: The actual underlying source series used for this standardized indicator.
        - `value_name`: The actual series name used for the returned `val`. For `policy_rate`, this is the canonical policy-series label chosen by the platform (for example, ECB Deposit Facility Rate or Federal Funds Target Range Upper Bound).
        - `source_local_name`: Official local-language series label when available.
        - `is_proxy`: True when the standardized indicator is populated using a documented proxy rather than a directly named national headline series.
        - `proxy_note`: Short explanation of the proxy choice when `is_proxy=true`.
        - `policy_role`: For `policy_rate`, the role of the canonical rate inside its official rate family (for example `primary` or `target_upper`).
        - `policy_structure`: For `policy_rate`, the policy-regime structure such as `single_primary`, `target_range`, `primary_plus_corridor`, or `non_rate_regime`.
        - `comparison_compatible`: For `policy_rate`, whether the returned `val` can be honestly used in cross-country policy-rate comparisons.
        - `policy_family`: Optional top-level metadata listing sibling policy-rate indicators in the same official family.
        - `data[].predicted_value` *(deprecated — use `/v1/predictions/{currency}/{indicator}` instead)*: Market or professional-forecaster expectation for this indicator reading, in the same units as `val`. Present only where a prediction source is available.
        - `data[].prediction_type` *(deprecated — use `/v1/predictions/{currency}/{indicator}` instead)*: Legacy per-source category. See `prediction_class` on `/v1/predictions` for the consolidated axis: `market_consensus` covers both compiled consensus and forecaster surveys, and `market_prediction` is market-implied, not a survey.
        - `data[].prediction_source` *(deprecated — use `/v1/predictions/{currency}/{indicator}` instead)*: Stable identifier for the prediction source (e.g. `ecb_spf` for the ECB Survey of Professional Forecasters). Null when `predicted_value` is absent.

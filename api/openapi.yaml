  /v1/forex/{base}/{quote}:
    get:
      description: |-
        Fetches daily FX spot rates between two currencies using official central-bank reference rates.

        **Path Parameters:**
        - `base`: Base currency code (e.g., AUD, USD).
        - `quote`: Quote currency code (e.g., USD, EUR).

        **Query Parameters:**
        - `start_date`: Optional. Start date YYYY-MM-DD. Defaults to 365 days ago.
        - `end_date`: Optional. End date YYYY-MM-DD. Defaults to today.

        - `indicators`: Optional. Comma-separated list of technical indicators to compute from the spot-rate series and include in the response. Pass `all` to include every supported indicator. Supported values: `adx_14`, `atr_14`, `bollinger_bands`, `cci_20`, `donchian_20`, `ema_12`, `ema_20`, `ema_200`, `ema_26`, `ema_50`, `macd`, `macd_histogram`, `macd_signal`, `rsi_14`, `sma_20`, `sma_200`, `sma_50`, `stochastic_14_3`, `williams_r_14`, `all`.

        **Daily reference OHLC:**
        - On qualifying dates, `data[]` also includes `open`, `high`, `low`, and `close` built from timestamped eligible reference observations. These are `reference_observation_ohlc` bars, not executable-market candles. Rows without at least four observations omit the OHLC fields.

        **FX source and derivation metadata:**
        - FX values are official reference rates collected by FXMacroData. USD-quoted pairs are the base series; inverse and cross pairs are derived from those legs when the publisher does not provide the requested pair directly.
        - Responses include `pair_metadata` and row-level `data[].source` with `direct_available`, `inverse_available`, `is_derived`, `derived_from_inverse`, `derived_from_cross`, `derived_from_source_legs`, `derivation_method`, `anchor_currency`, `source_pair`, `source_legs`, and `pair_consistency_check`.
        - Upstream FX source priority is BIS XRU daily USD exchange rates where available, then official national-bank daily sources, explicitly labelled EUR/CAD-derived daily crosses, official USD pegs, BIS monthly averages expanded to business days, IMF IFS monthly rates, and World Bank annual rates. Lower-frequency expansions are labelled with `source_frequency` and `derivation_method`; they are not presented as true daily fixings.
        - `data[].observation_datetime` is the UTC midnight timestamp for the FX reference date. It is an observation-date marker, not a publication timestamp.
        - XAU/USD and USD/XAU use the Royal Mint gold chart reference. Chart labels are preserved where available; no publication timestamp or LBMA auction fixing is asserted. Weekday-label coverage is included.
      operationId: get_forex
      parameters:
      - description: "Required path parameter. Base currency code Allowed values:\
          \ AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR,\
          \ NGN, NOK, NZD, PEN, SEK, THB, TWD, USD."
        explode: false
        in: path
        name: base
        required: true
        schema:
          description: Base currency code
          example: AUD
          title: Base
          type: string
        style: simple
      - description: "Required path parameter. Quote currency code Allowed values:\
          \ AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR,\
          \ NGN, NOK, NZD, PEN, SEK, THB, TWD, USD."
        explode: false
        in: path
        name: quote
        required: true
        schema:
          description: Quote currency code
          example: AUD
          title: Quote
          type: string
        style: simple
      - description: Optional query parameter. Start date YYYY-MM-DD
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Start date YYYY-MM-DD
          title: Start Date
          type: string
        style: form
      - description: Optional query parameter. End date YYYY-MM-DD
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: End date YYYY-MM-DD
          title: End Date
          type: string
        style: form
      - description: Optional query parameter. Maximum rows to return. Defaults to
          20. Maximum 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: Maximum rows to return. Defaults to 20. Maximum 100.
          format: int64
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: Optional query parameter. Number of rows to skip after most-recent-first
          ordering.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of rows to skip after most-recent-first ordering.
          format: int64
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: "Optional query parameter. One-based page number. When supplied,\
          \ it takes precedence over offset."
        explode: true
        in: query
        name: page
        required: false
        schema:
          description: "One-based page number. When supplied, it takes precedence\
            \ over offset."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        style: form
      - description: "Optional query parameter. Comma-separated technical indicators\
          \ to compute (e.g. sma_20,rsi_14,macd,bollinger_bands). Use 'all' to request\
          \ every supported indicator."
        explode: true
        in: query
        name: indicators
        required: false
        schema:
          description: "Comma-separated technical indicators to compute (e.g. sma_20,rsi_14,macd,bollinger_bands).\
            \ Use 'all' to request every supported indicator."
          title: Indicators
          type: string
        style: form
      - description: Optional query parameter. Pin the content version returned by
          the first page; changed history returns 409.
        explode: true
        in: query
        name: dataset_version
        required: false
        schema:
          description: Pin the content version returned by the first page; changed
            history returns 409.
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                base: USD
                quote: JPY
                source: Official central-bank reference rates
                provenance:
                  publisher: Official central-bank reference rates
                  storage: FXMacroData
                  timestamp_field: date
                  value_field: val
                pair_metadata:
                  direct_available: true
                  inverse_available: false
                  derived_from_inverse: false
                  derived_from_cross: false
                  derived_from_source_legs: false
                  is_derived: false
                  derivation_method: direct_original_pair
                  source_pair: USD/JPY
                  source_legs:
                  - pair: USD/JPY
                    source_provider: BIS XRU
                    source_name: BIS XRU daily USD exchange rates
                    source_url: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_XRU/1.0
                    source_frequency: daily
                  pair_consistency_check: passed
                data_quality:
                  source_name: Official central-bank reference rates
                  source_type: official
                  is_derived: false
                  datetime_field: observation_datetime
                  datetime_precision: date
                  source_legs:
                  - pair: USD/JPY
                    source_provider: BIS XRU
                    source_frequency: daily
                start_date: 2026-06-17
                end_date: 2026-06-18
                data:
                - date: 2026-06-18
                  val: 161.1288
                  observation_datetime: 1781740800
                  observation_datetime_iso: 2026-06-18T00:00:00Z
                  observation_datetime_precision: date
                  source:
                    source_pair: USD/JPY
                    source_legs:
                    - pair: USD/JPY
                      source_provider: BIS XRU
                      source_frequency: daily
                    is_derived: false
                    derivation_method: direct_original_pair
                    pair_consistency_check: passed
                - date: 2026-06-17
                  val: 161.1288
                  observation_datetime: 1781654400
                  observation_datetime_iso: 2026-06-17T00:00:00Z
                  observation_datetime_precision: date
                  source:
                    source_pair: USD/JPY
                    source_legs:
                    - pair: USD/JPY
                      source_provider: BIS XRU
                      source_frequency: daily
                    is_derived: false
                    derivation_method: direct_original_pair
                    pair_consistency_check: passed
                indicators:
                  sma_20: 0.6519
                  rsi_14: 58.42
                  macd:
                    macd: 0.0012

  /v1/cot/{currency}:
    get:
      description: |-
        Returns weekly CFTC Legacy Futures-Only COT report data for the specified currency's FX futures contract.

        **Supported currencies:** AUD, CAD, CHF, EUR, GBP, JPY, MXN, NZD, USD, XAU

        **Path Parameters:**
        - `currency`: 3-letter currency code (e.g., EUR, GBP, JPY).

        **Query Parameters:**
        - `start_date`: Optional. Start date YYYY-MM-DD. Defaults to 52 weeks ago.
        - `end_date`: Optional. End date YYYY-MM-DD. Defaults to today.

        **Authentication:** USD data is publicly available, but anonymous callers are limited to the most recent 90 days; an earlier `start_date` is clamped automatically. All other currencies require a professional API key supplied via `?api_key=<key>` or the `X-API-Key` header. Authenticated callers (any valid key) receive the full requested history for every currency.

        **Data source:** CFTC public API — https://publicreporting.cftc.gov/resource/6dca-aqww.json
      operationId: get_cot
      parameters:
      - description: "Required path parameter. Allowed values: AUD, CAD, CHF, EUR,\
          \ GBP, JPY, MXN, NZD, USD, XAU."
        explode: false
        in: path
        name: currency
        required: true
        schema:
          example: AUD
          title: Currency
          type: string
        style: simple
      - description: Optional query parameter. Start date YYYY-MM-DD
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Start date YYYY-MM-DD
          title: Start Date
          type: string
        style: form
      - description: Optional query parameter. End date YYYY-MM-DD
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: End date YYYY-MM-DD
          title: End Date
          type: string
        style: form
      - description: Optional query parameter. Maximum rows to return. Defaults to
          20. Maximum 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: Maximum rows to return. Defaults to 20. Maximum 100.
          format: int64
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: Optional query parameter. Number of rows to skip after most-recent-first
          ordering.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of rows to skip after most-recent-first ordering.
          format: int64
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: "Optional query parameter. One-based page number. When supplied,\
          \ it takes precedence over offset."
        explode: true
        in: query
        name: page
        required: false
        schema:
          description: "One-based page number. When supplied, it takes precedence\
            \ over offset."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                currency: JPY
                instrument: JAPANESE YEN - CHICAGO MERCANTILE EXCHANGE
                source: CFTC public reporting API
                source_url: https://publicreporting.cftc.gov/resource/6dca-aqww.json
                fx_overlay:
                  pair: USD/JPY
                start_date: 2025-09-01
                end_date: 2026-03-01
                data:
                - date: 2026-02-24
                  announcement_datetime: 1771996800
                  open_interest: 245678
                  noncommercial_long: 62400
                  noncommercial_short: 70420
                  noncommercial_net: -8020
              schema:
                $ref: "#/components/schemas/COTResponse"
          description: COT report history for the selected futures market.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get CFTC Commitment of Traders (COT) data
      tags:
      - FXMacroData
      x-parameter-availability:
        currency:
        - AUD
        - CAD
        - CHF
        - EUR
        - GBP
        - JPY
        - MXN
        - NZD
        - USD
        - XAU

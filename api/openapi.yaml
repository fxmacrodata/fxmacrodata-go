                    histogram: 3.0E-4
              schema:
                $ref: "#/components/schemas/ForexResponse"
          description: Daily FX spot-rate series with optional computed technical
            indicators.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get FX spot rates
      tags:
      - FXMacroData

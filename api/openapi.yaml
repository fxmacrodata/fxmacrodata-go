        applied:
          title: Applied
          type: boolean
        delay_seconds:
          format: int64
          title: Delay Seconds
          type: integer
        delay_minutes:
          format: int64
          title: Delay Minutes
          type: integer
        cutoff:
          format: int64
          title: Cutoff
          type: integer
        cutoff_iso:
          nullable: true
          type: string
        withheld_count:
          format: int64
          title: Withheld Count
          type: integer
        message:
          title: Message
          type: string
        subscribe_url:
          title: Subscribe Url
          type: string
        next_available_at:
          format: int64
          nullable: true
          type: integer
        next_available_at_iso:
          nullable: true
          type: string
      required:
      - applied
      - cutoff
      - delay_minutes
      - delay_seconds
      - message
      - subscribe_url
      - withheld_count
      title: FreemiumDelayNotice

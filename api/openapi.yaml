    ReleaseTiming:
      description: |-
        Scheduled, published, collected and available times for one release capture.

        Present on rows captured at release time from the official source. The
        publication window is bounded by FXMacroData's own reads of the official
        source; it is not a timestamp supplied by the publisher. Bounds that
        could not be established are null.
      example:
        scheduled_at: scheduled_at
        published_after: published_after
        published_by: published_by
        publication_window_basis: publication_window_basis
        collected_at: collected_at
        available_at: available_at
        pickup_ms_min: 5.025004791520295
        pickup_ms_max: 9.965781217890562
      properties:
        scheduled_at:
          description: "Official scheduled release time (ISO 8601, UTC)."
          nullable: true
          type: string
        published_after:
          description: "The official source still showed the previous period after\
            \ this instant (ISO 8601, UTC), or its `Last-Modified` header placed the\
            \ update after it. Null when no such read was made."
          nullable: true
          type: string
        published_by:
          description: "The first read of the official source that showed this period\
            \ completed at this instant (ISO 8601, UTC), so the release was public\
            \ by then. Null when the window could not be bounded."
          nullable: true
          type: string
        publication_window_basis:
          description: "How the window was bounded: `poll_bracket` (a read showing\
            \ the previous period, then a read showing this one), `last_modified`\
            \ (the source's `Last-Modified` header sets the lower bound), or `first_new_period_read_only`\
            \ (only the upper bound is known)."
          nullable: true
          type: string
        collected_at:
          description: "When FXMacroData first captured this value from the official\
            \ source (ISO 8601, UTC). Same instant as `collected_at_iso`."
          nullable: true
          type: string
        available_at:
          description: "When this value was committed to the FXMacroData store and\
            \ readable through the API (ISO 8601, UTC, microsecond precision). Null\
            \ on rows captured before this time was recorded."
          nullable: true
          type: string
        pickup_ms_min:
          description: "Milliseconds from `published_by` to `available_at`: the shortest\
            \ time the value can have taken to become available after publication.\
            \ Null when either time is missing or `available_at` precedes `published_by`."
          format: double
          nullable: true
          type: number
        pickup_ms_max:
          description: "Milliseconds from `published_after` to `available_at`: the\
            \ value was available through the API within this long of publication.\
            \ Null when no read showed the previous period still in place, or when\
            \ `available_at` is missing."
          format: double
          nullable: true
          type: number
      title: ReleaseTiming

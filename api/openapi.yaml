  /v1/commodities/{indicator}:
    get:
      description: |-
        Returns commodity and energy price observations with source provenance.

        **Supported indicators:** `crude_oil_inventories`, `gold`, `natural_gas`, `natural_gas_storage`, `oil_brent`, `oil_wti`, `platinum`, `silver`.

        The supported-indicator list above is the complete list of indicators this endpoint serves.

        **Precious metals** — sourced from The Royal Mint public chart API (https://www.royalmint.com/).

        - **Gold**, **silver**, **platinum**: Royal Mint chart reference prices, USD/troy oz. Sampling provenance is provided per observation. These are not verified LBMA auction fixings or executable quotes. Historical coverage can be sparse; see the returned weekday-label coverage. Chart labels do not establish publication times.

        **Energy** — sourced from the U.S. Energy Information Administration (https://api.eia.gov/v2/).

        - **WTI crude oil** (`oil_wti`): Cushing, OK spot price, USD/barrel.
        - **Brent crude oil** (`oil_brent`): Europe spot price, USD/barrel.
        - **Natural gas** (`natural_gas`): Henry Hub spot price, USD/MMBtu.

        **Query Parameters:**
        - `start_date`: Earliest date to include (YYYY-MM-DD). Defaults to 365 days ago.
        - `end_date`: Latest date to include (YYYY-MM-DD). Defaults to today.

        **Authentication:** A professional API key is required. Supply it via `?api_key=<key>` or the `X-API-Key` header.
      operationId: get_commodities
      parameters:
      - description: "Required path parameter. Commodity indicator slug Allowed values:\
          \ crude_oil_inventories, gold, natural_gas, natural_gas_storage, oil_brent,\
          \ oil_wti, platinum, silver."
        explode: false
        in: path
        name: indicator
        required: true
        schema:
          description: Commodity indicator slug
          example: crude_oil_inventories
          title: Indicator
          type: string
        style: simple
      - description: Optional query parameter. Start date YYYY-MM-DD
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Start date YYYY-MM-DD
          title: Start Date
          type: string
        style: form
      - description: Optional query parameter. End date YYYY-MM-DD
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: End date YYYY-MM-DD
          title: End Date
          type: string
        style: form
      - description: Optional query parameter. Maximum rows to return. Defaults to
          20. Maximum 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: Maximum rows to return. Defaults to 20. Maximum 100.
          format: int64
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: Optional query parameter. Number of rows to skip after most-recent-first
          ordering.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of rows to skip after most-recent-first ordering.
          format: int64
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: "Optional query parameter. One-based page number. When supplied,\
          \ it takes precedence over offset."
        explode: true
        in: query
        name: page
        required: false
        schema:
          description: "One-based page number. When supplied, it takes precedence\
            \ over offset."
          format: int64
          minimum: 1
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                currency: COMM
                indicator: gold
                source: The Royal Mint chart reference
                source_url: https://www.royalmint.com/
                has_official_forecast: false
                start_date: 2026-09-01
                end_date: 2026-09-09
                data:
                - date: 2026-09-09
                  val: 4353.9
                  publication_time_status: unknown
                  sampling_method: legacy_chart_selection_unverified
                - date: 2026-09-08
                  val: 4428.34
                  publication_time_status: unknown
                  sampling_method: legacy_chart_selection_unverified
              schema:
                $ref: "#/components/schemas/CommodityResponse"
          description: Time-series data for the requested commodity indicator.
        "404":
          content:
            application/json:
              example:
                detail: Unsupported commodity indicator (xyz)
          description: Unsupported commodity indicator.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get commodity indicator data
      tags:
      - FXMacroData
      x-parameter-availability:
        indicator:
        - crude_oil_inventories
        - gold
        - natural_gas
        - natural_gas_storage
        - oil_brent
        - oil_wti
        - platinum
        - silver
  /v1/announcements/changes:
    get:
      description: |-
        Returns recent live announcement release events from the same durable fanout used by the real-time SSE stream. Use `next_cursor` as the `since` value on the next poll. This endpoint is intended for serverless clients that cannot hold a persistent SSE connection.

        **Authentication:** USD events are available without an API key. Non-USD currencies require a paid API key supplied via `api_key` or `X-API-Key`.

        **Free access is delayed.** Without an API key this feed is held back by 15 minutes: an event is delivered once it is 15 minutes old, and `next_cursor` stops at the delay cutoff so nothing is skipped. The response carries a `freemium_delay` object naming the cutoff, how many events are being withheld, and when the next one becomes available. An Individual or Business API key removes the delay; `/v1/stream/events` pushes the same events in real time.

        **Retention:** Events are retained for the configured fanout window, currently exposed in `retention_seconds`. If a client is offline longer than that window, re-bootstrap from `/v1/announcements/{currency}/latest` and continue polling changes.
      operationId: get_announcement_changes
      parameters:
      - description: "Optional query parameter. Comma-separated currency codes, `g10`,\
          \ or `all`. Without a paid API key the result is restricted to USD."
        explode: true
        in: query
        name: currencies
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: "Optional query parameter. Optional comma-separated announcement\
          \ indicator slugs. Allowed values: afe_dollar_index, average_hourly_earnings,\
          \ average_hourly_earnings_mom, balance_on_goods, balance_on_services, bgcr,\
          \ breakeven_inflation_rate, broad_dollar_index, broad_money, building_approvals,\
          \ building_permits, business_confidence, capital_account_balance, cb_assets,\
          \ commodity_price_energy, commodity_price_ex_energy, commodity_price_index,\
          \ commodity_prices, consumer_confidence, core_inflation, core_inflation_median,\
          \ core_inflation_mom, core_inflation_trim, core_pce, core_pce_mom, credit_growth,\
          \ crude_oil_inventories, current_account_balance, dairy_exports, deposit_rates,\
          \ durable_goods_orders, effr, eme_dollar_index, employment, exports, financial_account_balance,\
          \ foreign_reserves, full_time_employment, fx_reserves, gdp, gdp_growth_q4_yoy,\
          \ gold_reserves, gov_bond_10y, gov_bond_15y, gov_bond_1_5m, gov_bond_1m,\
          \ gov_bond_1y, gov_bond_20y, gov_bond_25y, gov_bond_2m, gov_bond_2y, gov_bond_30y,\
          \ gov_bond_3m, gov_bond_3y, gov_bond_40y, gov_bond_4m, gov_bond_4y, gov_bond_5y,\
          \ gov_bond_6m, gov_bond_6y, gov_bond_7y, gov_bond_8y, gov_bond_9y, government_debt,\
          \ house_price_index, house_prices, household_credit, household_spending,\
          \ housing_starts, imports, inflation, inflation_linked_bond, inflation_mom,\
          \ initial_jobless_claims, international_assets, international_liabilities,\
          \ job_openings, m1, m2, m3, nairu, natural_gas_storage, net_foreign_asset_position,\
          \ non_farm_payrolls, non_farm_payrolls_change, obfr, part_time_employment,\
          \ participation_rate, pce, pce_mom, policy_rate, policy_rate_midpoint, policy_rate_mlf,\
          \ policy_rate_mro, policy_rate_target_lower, ppi, primary_income_balance,\
          \ real_yield_20y, real_yield_30y, real_yield_5y, real_yield_7y, retail_sales,\
          \ retail_sales_control_group, retail_sales_ex_autos, retail_sales_ex_autos_and_gas,\
          \ risk_free_rate, secondary_income_balance, sight_deposits, snb_balance_sheet,\
          \ sofr_average_180d, sofr_average_30d, sofr_average_90d, sofr_index, terms_of_trade,\
          \ tgcr, trade_balance, trade_weighted_index, trimmed_mean_inflation, unemployment,\
          \ wage_price_index, wages."
        explode: true
        in: query
        name: indicators
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. Cursor returned as `next_cursor` by
          the previous response. ISO 8601 timestamps and Unix epoch seconds are also
          accepted.
        explode: true
        in: query
        name: since
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      - description: Optional query parameter. Maximum number of matching change events
          to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of matching change events to return.
          format: int64
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: "Optional query parameter. Use `compact` for trigger payloads\
          \ or `full` for row fields. Allowed values: compact, full."
        explode: true
        in: query
        name: payload
        required: false
        schema:
          description: Pin first-page content version; changed history returns 409.
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementChangesResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error

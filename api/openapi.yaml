  /v1/market_sessions:
    get:
      description: |-
        Returns a real-time snapshot of the four major FX trading sessions (Sydney, Tokyo, London, New York) and their overlap windows.

        Each session entry shows today's open and close times in UTC, whether the session is currently open, and seconds until it opens or closes.

        Overlap windows highlight the highest-liquidity trading periods — in particular the **London / New York** overlap (~13:00–17:00 UTC in winter), which sees the largest volume and tightest spreads on major USD pairs.

        **Query Parameters:**
        - `at`: Optional ISO-8601 UTC timestamp (e.g. `2026-03-05T12:00:00Z`). Defaults to the current server time. Useful for scheduling or back-testing decisions.

        **No authentication required.**
      operationId: get_market_sessions
      parameters:
      - description: Optional query parameter. Optional ISO-8601 UTC timestamp (e.g.
          2026-03-05T12:00:00Z)
        explode: true
        in: query
        name: at
        required: false
        schema:
          description: Optional ISO-8601 UTC timestamp (e.g. 2026-03-05T12:00:00Z)
          title: At
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                now_utc: 2026-03-05T12:00:00Z
                now_unix: 1741176000
                is_market_day: true
                sessions:
                - name: Sydney
                  display_name: Sydney (Australia / New Zealand)
                  description: First major session to open after the weekend.
                  currencies:
                  - AUD
                  - NZD
                  timezone: Australia/Sydney
                  open_utc: 2026-03-04T23:00:00Z
                  close_utc: 2026-03-05T08:00:00Z
                  open_unix: 1741129200
                  close_unix: 1741161600
                  is_open: false
                - name: London
                  display_name: London (United Kingdom / Europe)
                  description: Largest FX session by volume.
                  currencies:
                  - GBP
                  - EUR
                  - CHF
                  timezone: Europe/London
                  open_utc: 2026-03-05T08:00:00Z
                  close_utc: 2026-03-05T17:00:00Z
                  open_unix: 1741161600
                  close_unix: 1741194000
                  is_open: true
                  seconds_to_close: 18000
                overlaps:
                - name: London / New York
                  sessions:
                  - London
                  - New York
                  description: Most active window of the trading day.
                  priority: high
                  notable_pairs:
                  - EUR/USD
                  - GBP/USD
                  - USD/CHF
                  - USD/CAD
                  start_utc: 2026-03-05T13:00:00Z
                  end_utc: 2026-03-05T17:00:00Z
                  start_unix: 1741179600
                  end_unix: 1741194000
                  is_active: false
                  seconds_to_start: 3600
                  duration_hours: 4.0
              schema:
                $ref: "#/components/schemas/MarketSessionsResponse"
          description: Session snapshot including open/close state and overlap windows.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: FX market session timetable
      tags:
      - FXMacroData
  /v1/rate_differentials/{base}/{quote}:
    get:
      description: |-
        Returns a historical differential between the base and quote currency using a shared rate measure. The endpoint aligns the two legs by date intersection and reports the spread in both percentage points and basis points.

        **Measures:**
        - Supported values: `auto`, `risk_free_rate`, `gov_bond_2y`, `gov_bond_10y`, `policy_rate`.
        - `auto` prefers `risk_free_rate`, then `gov_bond_2y`, then `policy_rate`.

        **Rate Types:**
        - Supported values: `spot`, `forward`.
        - `spot` compares the selected shared rate measure.
        - `forward` derives each leg from government bond curve nodes, then aligns dates.

        **Authentication:**
        - Requires an Individual or Business API key via `?api_key=<key>` or `X-API-Key`.
      operationId: get_rate_differentials
      parameters:
      - description: "Required path parameter. Base currency code Allowed values:\
          \ AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR,\
          \ NGN, NOK, NZD, PEN, SEK, THB, TWD, USD."
        explode: false
        in: path
        name: base
        required: true
        schema:
          description: Base currency code
          example: AUD
          title: Base
          type: string
        style: simple
      - description: "Required path parameter. Quote currency code Allowed values:\
          \ AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR,\
          \ NGN, NOK, NZD, PEN, SEK, THB, TWD, USD."
        explode: false
        in: path
        name: quote
        required: true
        schema:
          description: Quote currency code
          example: AUD
          title: Quote
          type: string
        style: simple
      - description: "Optional query parameter. Shared rate measure to compare across\
          \ the pair. Allowed values: auto, risk_free_rate, gov_bond_2y, gov_bond_10y,\
          \ policy_rate."
        explode: true
        in: query
        name: measure
        required: false
        schema:
          default: auto
          description: Shared rate measure to compare across the pair.
          example: auto
          title: Measure
          type: string
        style: form
      - description: "Optional query parameter. Differential type: spot for shared\
          \ rate measures, forward for derived curve segments. Allowed values: spot,\
          \ forward."
        explode: true
